# CI básico: en cada push y pull request a main comprueba que el código
# pasa ESLint, la comprobación de tipos de TypeScript y el build de producción.
# El despliegue (CD) lo hace Vercel por su cuenta; esto solo avisa si algo se rompe.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si se suben varios commits seguidos, cancela la ejecución anterior de la misma rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      # typecheck genera antes los tipos globales de Next (LayoutProps, PageProps…) con
      # `next typegen`: en un checkout limpio no existe .next/types y tsc fallaría
      - name: Comprobación de tipos
        run: npm run typecheck

      # El build lee contenido de Sanity, así que necesita el ID del proyecto y el dataset. Son
      # datos públicos (van dentro del JS de la web): se guardan como *variables* del repo
      # (Settings → Secrets and variables → Actions → Variables), no como secrets.
      - name: Build de producción
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
